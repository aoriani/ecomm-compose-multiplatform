ktor:
  application:
    modules:
      - dev.aoriani.ecomm.ApplicationKt.module
  deployment:
    port: "$PORT:8080"

ecomm:
  database:
    url: "jdbc:h2:./data/products"
    driver: "org.h2.Driver"
  logging:
    level: "DEBUG"
  mcp:
    server-name: "ecomm-mcp-server"
    server-version: "0.0.1"
    allowed-hosts:
      - "localhost"
      - "127.0.0.1"
      - "[::1]"
      - "api.aoriani.dev"

    allowed-origins:
      - "http://localhost"
      - "https://api.aoriani.dev"
  images:
    base-url: "https://api.aoriani.dev/static/images"
